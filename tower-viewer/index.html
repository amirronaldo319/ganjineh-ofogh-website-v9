<title>Ganjineh Ofogh Tower</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<style>
:root {
  --ink: #1e2a24; --muted: #5c655e; --panel: rgba(251,248,242,.91); --panel-solid: #fbf8f2; --line: rgba(30,42,36,.15);

  --bg: #b9c6cf; --load-bg: #f3eee5; --load-ink: #1f3a2f; --load-sub: #5c655e;
  --scene-ink: #1e2a24; --scene-sub: #3f4a43; --scene-glow: rgba(255,255,255,.42); --scrim: rgba(246,241,231,.62);
  --font-ui: "Inter", "Vazirmatn", system-ui, -apple-system, "Segoe UI", sans-serif;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #ede8dc; --muted: #a9b0a8; --panel: rgba(20,32,27,.89); --panel-solid: #16231e; --line: rgba(237,232,220,.17);
    --accent: #d6c18f; --accent-ink: #14201b; --brass: #c9b27a;
    --tag-plan: #9fd0b4; --tag-render: #d6b878; --tag-assumed: #a9b0a8; --tag-check: #e39a78;
    --bg: #141c24; --load-bg: #0f1a16; --load-ink: #d6c18f; --load-sub: #a9b0a8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #ede8dc; --muted: #a9b0a8; --panel: rgba(20,32,27,.89); --panel-solid: #16231e; --line: rgba(237,232,220,.17);
  --accent: #d6c18f; --accent-ink: #14201b; --brass: #c9b27a;
  --tag-plan: #9fd0b4; --tag-render: #d6b878; --tag-assumed: #a9b0a8; --tag-check: #e39a78;
  --bg: #141c24; --load-bg: #0f1a16; --load-ink: #d6c18f; --load-sub: #a9b0a8;
  color-scheme: dark;
}
body.night {
  --ink: #ede8dc; --muted: #a9b0a8; --panel: rgba(20,32,27,.88); --panel-solid: #16231e; --line: rgba(237,232,220,.17);
  --accent: #d6c18f; --accent-ink: #14201b; --brass: #c9b27a;
  --tag-plan: #9fd0b4; --tag-render: #d6b878; --tag-assumed: #a9b0a8; --tag-check: #e39a78;
  --scene-ink: #f4efe4; --scene-sub: #cfc9bc; --scene-glow: rgba(0,0,0,.65); --scrim: rgba(8,14,12,.55);
}
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; height: 100%; position: relative; overflow: hidden; background: var(--bg); color: var(--ink);
  font-family: var(--font-ui); font-size: 14px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
html[lang="fa"] body { font-family: var(--font-fa); }
button { font: inherit; color: inherit; }
#stage { position: absolute; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; outline: none; }
.vignette { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to bottom, var(--scrim) 0, transparent 150px), radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.18) 100%); }

/* identity block, set like the brochure's page header: brass hairline, serif name, small caps place line */
.brand { position: absolute; top: 14px; inset-inline-start: 16px; inset-inline-end: 112px; pointer-events: none; text-shadow: 0 1px 14px var(--scene-glow); }
.brand .rule { display: block; width: 30px; height: 2px; background: var(--brass); margin-bottom: 8px; border-radius: 1px; }
.brand h1 { margin: 0; display: grid; gap: 1px; font-weight: 600; color: var(--scene-ink); }
.brand .en { font-family: var(--font-serif); font-size: 25px; line-height: 1.15; letter-spacing: .005em; }
.brand .fa { font-family: var(--font-fa); font-size: 18px; line-height: 1.4; font-weight: 500; justify-self: start; }
html[lang="fa"] .brand .fa { font-size: 25px; font-weight: 700; line-height: 1.25; order: -1; }
html[lang="fa"] .brand .en { font-size: 16px; }
.brand .kick { display: block; margin-top: 6px; font-size: 10.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--scene-sub); font-weight: 500; }
html[lang="fa"] .brand .kick { letter-spacing: 0; text-transform: none; font-size: 12px; }
.brand .read { display: block; margin-top: 2px; font-size: 12px; color: var(--scene-sub); font-variant-numeric: tabular-nums; }

.topbtns { position: absolute; top: 12px; inset-inline-end: 16px; display: flex; gap: 8px; }
.iconbtn {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  font: 600 14px/1 var(--font-ui); cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  display: grid; place-items: center;
}
.iconbtn.fa-btn { font-family: var(--font-fa); font-size: 15px; }

#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.alabel {
  position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer; border: 0;
  background: var(--panel-solid); color: var(--ink); border-radius: 999px; padding: 11px 12px 11px 9px; min-height: 40px; font-weight: 600; font-size: 12.5px; line-height: 1.1;
  display: flex; align-items: center; gap: 7px; box-shadow: 0 2px 14px rgba(0,0,0,.28); white-space: nowrap; font-variant-numeric: tabular-nums;
}
.alabel i { width: 12px; height: 12px; border-radius: 50%; display: block; border: 2px solid rgba(255,255,255,.85); }
.alabel small { font-weight: 400; color: var(--muted); font-size: 11.5px; }
.alabel.on { outline: 2px solid var(--accent); }

.dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 16px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
.dock > * { pointer-events: auto; }
.pill {
  display: flex; gap: 3px; padding: 4px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); max-width: 100%; box-shadow: 0 4px 18px rgba(0,0,0,.12);
}
.pill button {
  min-height: 40px; min-width: 40px; padding: 0 12px; border-radius: 999px; border: 0; background: transparent; color: var(--ink);
  font-weight: 400; font-size: 13.5px; cursor: pointer; white-space: nowrap;
}
.pill button[aria-pressed="true"], .pill button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.pill.tabs button { padding: 0 18px; font-weight: 600; }
.opts[hidden] { display: none; }
.card {
  width: min(100%, 440px); background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 6px 24px rgba(0,0,0,.14);
}
.card .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.card .big { font-size: 16.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.card .sub { font-size: 12.5px; color: var(--muted); }
.card input[type=range] { width: 100%; margin: 4px 0 2px; accent-color: var(--accent); height: 40px; }
.card.tod { padding-block: 8px 4px; }
.card.tod .row { padding-inline: 4px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.chip { display: flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: 13px; cursor: pointer; }
.chip i { width: 11px; height: 11px; border-radius: 50%; display: block; flex: none; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.chip[aria-pressed="true"] i { box-shadow: 0 0 0 2px rgba(255,255,255,.8); }
.hint { margin: 8px 0 0; font-size: 12px; color: var(--muted); }

.aptcard { display: grid; grid-template-columns: 104px 1fr; gap: 12px; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.aptcard[hidden] { display: none; }
.thumb { position: relative; width: 104px; height: 84px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); padding: 0; overflow: hidden; cursor: zoom-in; }
.thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
.thumb span { position: absolute; inset-inline-end: 4px; bottom: 3px; font-size: 10px; color: #1e2a24; background: rgba(246,241,231,.88); padding: 0 4px; border-radius: 4px; }
.aptmeta { min-width: 0; display: grid; gap: 3px; }
.aptmeta .at { font-size: 14.5px; font-weight: 600; }
.aptmeta .at small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.areas { margin: 0; display: grid; gap: 1px; font-variant-numeric: tabular-nums; }
.areas div { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; }
.areas dt { color: var(--muted); } .areas dd { margin: 0; font-weight: 600; }
.badge { display: inline-block; justify-self: start; font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 1px 7px; border-radius: 4px; border: 1px solid var(--tag-check); color: var(--tag-check); }
html[lang="fa"] .badge, html[lang="fa"] .tag { letter-spacing: 0; text-transform: none; }

.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 40px; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-weight: 600; font-size: 14px; cursor: pointer; font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.mrow { display: grid; gap: 6px; }
.mrow + .mrow { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.mlabel { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-weight: 500; }
html[lang="fa"] .mlabel { letter-spacing: 0; text-transform: none; font-size: 12.5px; }
.toggles { display: flex; gap: 6px; flex-wrap: wrap; }
.toggles button { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: 13.5px; cursor: pointer; }
.toggles button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* sources drawer */
#sources { position: absolute; left: 0; right: 0; bottom: 0; max-height: 80%; display: flex; flex-direction: column; background: var(--panel-solid); border-top: 1px solid var(--line); border-radius: 20px 20px 0 0; box-shadow: 0 -12px 40px rgba(0,0,0,.28); z-index: 6; }
#sources[hidden] { display: none; }
.src-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 16px 16px 8px; max-width: 680px; width: 100%; margin-inline: auto; }
.src-head h2 { margin: 0; font-family: var(--font-serif); font-size: 21px; font-weight: 600; color: var(--accent); }
html[lang="fa"] .src-head h2 { font-family: var(--font-fa); font-weight: 700; font-size: 20px; }
.src-head small { display: block; margin-top: 2px; font-size: 12px; color: var(--muted); }
.xbtn { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 18px; line-height: 1; }
#src-body { overflow-y: auto; padding: 4px 16px calc(20px + env(safe-area-inset-bottom, 0px)); max-width: 680px; width: 100%; margin-inline: auto; display: grid; gap: 18px; -webkit-user-select: text; user-select: text; }
.sec h3 { margin: 0 0 8px; display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 600; }
.tag { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; padding: 1px 8px; border-radius: 4px; border: 1px solid currentColor; }
.tag.plan { color: var(--tag-plan); } .tag.render { color: var(--tag-render); } .tag.assumed { color: var(--tag-assumed); border-style: dashed; } .tag.check { color: var(--tag-check); }
.sec ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.sec li { padding-inline-start: 12px; border-inline-start: 2px solid var(--line); font-size: 13.5px; line-height: 1.5; overflow-wrap: anywhere; }
.sec.check li { border-inline-start-color: var(--tag-check); }
.src-foot { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }

#lightbox { position: fixed; inset: 0; z-index: 10; background: rgba(8,12,10,.82); display: grid; place-items: center; padding: 16px; }
#lightbox[hidden] { display: none; }
#lightbox .sheet { position: relative; max-width: min(100%, 720px); max-height: 100%; background: var(--paper); border-radius: 16px; padding: 10px; display: grid; gap: 8px; }
#lightbox img { display: block; max-width: 100%; max-height: calc(100vh - 150px); margin-inline: auto; object-fit: contain; }
#lightbox .cap { color: #1e2a24; font-size: 13px; text-align: center; padding: 0 8px 4px; font-variant-numeric: tabular-nums; }
#lightbox .xbtn { position: absolute; top: 8px; inset-inline-end: 8px; background: rgba(246,241,231,.92); color: #1e2a24; border-color: rgba(30,42,36,.2); }

#status { position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; padding: 24px; background: var(--load-bg); color: var(--load-ink); pointer-events: none; transition: opacity .6s ease; }
#status .mark { width: 34px; height: 2px; background: var(--brass); margin-bottom: 8px; }
#status .nm { font-family: var(--font-serif); font-size: 28px; font-weight: 600; letter-spacing: .005em; }
#status .nf { font-family: var(--font-fa); font-size: 19px; }
#status .msg { margin-top: 10px; font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--load-sub); }
#status .bar { width: 120px; height: 2px; background: rgba(168,137,92,.28); margin-top: 10px; overflow: hidden; border-radius: 1px; }
#status .bar i { display: block; width: 8%; height: 100%; background: var(--brass); }
#status.gone { opacity: 0; visibility: hidden; transition: opacity .6s ease, visibility 0s .6s; }
@media (prefers-reduced-motion: reduce) { #status, #status.gone { transition: none; } #status .bar i { transition: none; } }

/* v4 additions: side buttons, tour card, skip, sr-only, tags */
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.sidebtns { position: absolute; top: 62px; inset-inline-end: 16px; display: flex; flex-direction: column; gap: 8px; }
.iconbtn:active, .pill button:active, .chip:active, .toggles button:active, .seg button:active, .tbtn:active { transform: scale(.96); }
.iconbtn[aria-expanded="true"], .iconbtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.skip { position: absolute; top: 104px; inset-inline-start: 16px; min-height: 40px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); font-weight: 600; cursor: pointer; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); z-index: 4; }
.skip[hidden] { display: none; }
#tourcard { position: relative; }
#tourcard[hidden] { display: none; }
.tour-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
.tour-count { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
html[lang="fa"] .tour-count { letter-spacing: 0; text-transform: none; font-size: 12px; }
.xbtn.small { width: 40px; height: 40px; font-size: 18px; }
.tour-title { margin: 0 0 4px; font-family: var(--font-serif); font-size: 20px; font-weight: 600; color: var(--accent); line-height: 1.2; }
html[lang="fa"] .tour-title { font-family: var(--font-fa); font-weight: 700; font-size: 19px; }
.tour-cap { margin: 0; font-size: 13.5px; line-height: 1.5; min-height: 3em; }
.tour-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.tour-bar { height: 2px; background: var(--line); margin: 10px 0 8px; border-radius: 1px; overflow: hidden; }
.tour-bar i { display: block; height: 100%; width: 0; background: var(--brass); }
.tour-ctl { display: flex; justify-content: center; gap: 10px; }
.tbtn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; display: grid; place-items: center; }
.tbtn.main { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.tbtn svg[hidden] { display: none; }
.tag.brochure { color: var(--tag-brochure, var(--tag-render)); } .tag.unverified { color: var(--tag-check); border-style: dotted; }
.sec li { display: grid; gap: 3px; }
.sec li .src { font-size: 11.5px; color: var(--muted); }
.toast { position: absolute; left: 50%; top: 110px; transform: translateX(-50%); z-index: 8; max-width: min(92%, 420px); padding: 10px 16px; border-radius: 12px; background: var(--panel-solid); border: 1px solid var(--line); box-shadow: 0 6px 24px rgba(0,0,0,.2); font-size: 13px; }
#status.failed .mark { background: var(--tag-check); }
#status .bar i { transition: width .35s ease; }
@media (prefers-reduced-motion: reduce) { .iconbtn:active, .tbtn:active { transform: none; } }
.touring .opts { display: none !important; }
.touring .sidebtns #reset-btn { opacity: .9; }
</style>

aces":["sources"]},{"id":"render.balcony_guards","status":"render-observed","en":"Balconies with dark, vertically slatted guards and planters.","fa":"بالکن‌هایی با جان‌پناه تیره‌ی شیاردار عمودی و گلدان.","short":{"en":"Balconies have dark slatted guards and planters.","fa":"بالکن‌ها جان‌پناه تیره‌ی شیاردار و گلدان دارند."},"source":"brochure p06, p03; IMG_1165","surfaces":["sources","tour"]},{"id":"render.cladding","status":"render-observed","en":"Cream stone cladding with fine horizontal joints, black-framed windows and a tall ground floor.","fa":"نمای سنگ کرم با درزهای افقی ریز، پنجره‌های قاب‌مشکی و همکف بلند.","short":{"en":"Cream stone, black-framed windows, a tall ground floor.","fa":"سنگ کرم، پنجره‌های قاب‌مشکی و همکف بلند."},"source":"brochure p02, p06","surfaces":["sources","tour"]},{"id":"render.entrance","status":"render-observed","en":"A curved dark entrance canopy with a ring of downlights over a glass entrance, with low steps and low stone garden walls with planting.","fa":"سایبان منحنی تیره‌ی ورودی با ردیف چراغ‌های توکار بالای ورودی شیشه‌ای، همراه پله‌های کوتاه و دیوارهای کوتاه سنگی باغ با کاشت.","short":{"en":"A curved canopy over a glass entrance, low steps, low stone garden walls.","fa":"سایبان منحنی بالای ورودی شیشه‌ای، پله‌های کوتاه و دیوارهای کوتاه سنگی باغ."},"source":"brochure p01, p02, p03, p27","surfaces":["sources","tour"]},{"id":"render.helipad","status":"render-observed","en":"A helipad on the roof crown: dark slab with a thin white ring and an H, a white border line and about six warm perimeter lights.","fa":"هلی‌پد روی بلوک بام: صفحه‌ی تیره با حلقه‌ی نازک سفید و حرف H، خط حاشیه‌ی سفید و حدود شش چراغ گرم در پیرامون.","short":{"en":"A helipad crowns the roof.","fa":"یک هلی‌پد بام را تاج می‌دهد."},"source":"brochure p26, p02, p03","surfaces":["sources","tour","glb"]},{"id":"area.apt1.brochure","status":"brochure-text","value":143.25,"unit":"m2","en":"Apartment 1: 143.25 m².","fa":"واحد 1: 143.25 مترمربع.","source":"brochure p19, p20","surfa بخانه را نام می‌برد."},"source":"brochure p11","surfaces":["sources","tour"]},{"id":"brochure.status","status":"brochure-text","en":"The brochure is a 27-page correction proof: editorial revisions applied, architectural and factual approval pending.","fa":"بروشور یک نسخه‌ی اصلاحی 27 صفحه‌ای است: اصلاحات ویراستاری انجام شده و تأیید معماری و اطلاعات هنوز در انتظار است.","source":"brochure PDF metadata","surfaces":["sources"]},{"id":"brochure.disclaimer","status":"brochure-text","en":"The brochure says its images and plans are conceptual, plans are not to scale, and areas, dimensions and rooftop use require approved project records.","fa":"بروشور می‌گوید تصاویر و پلان‌هایش مفهومی‌اند، پلان‌ها مقیاس ندارند و مساحت، ابعاد و کاربری بام تابع مدارک مصوب پروژه است.","source":"brochure p26","surfaces":["sources"]},{"id":"site.area","status":"unverified","value":2064,"unit":"m2","en":"Site area 2,064 m². Supplied figure; measurements await approved project records.","fa":"مساحت زمین 2,064 مترمربع. رقم ارائه‌شده؛ اندازه‌گیری مساحت‌ها نیازمند مدارک مصوب پروژه است.","source":"brochure p06","surfaces":["sources"]},{"id":"site.landscaped","status":"unverified","value":1400,"unit":"m2","en":"Landscaped area over 1,400 m². Supplied figure; measurements await approved project records.","fa":"فضای سبز بیش از 1,400 مترمربع. رقم ارائه‌شده؛ اندازه‌گیری مساحت‌ها نیازمند مدارک مصوب پروژه است.","source":"brochure p06","surfaces":["sources"]},{"id":"site.shared","status":"unverified","value":700,"unit":"m2","en":"Shared spaces 700 m². Supplied figure; measurements await approved project records.","fa":"فضاهای مشاع 700 مترمربع. رقم ارائه‌شده؛ اندازه‌گیری مساحت‌ها نیازمند مدارک مصوب پروژه است.","source":"brochure p06","surfaces":["sources"]},{"id":"assumed.heights","status":"assumed","value":[4.6,3.05],"unit":"m","en":"Floor heights: 4.6 m ground floor and 3.05 m typical floor. No section or elevation was supplied.","fa":"ارتفاع طبقات: همکف 4.6 متر و طبقه تیپ 3.05 متر. هیچ مقطع یا نمایی ارائه نشده است.","short":{"en":"Floor heights are assumed.","fa":"ارتفاع طبقات فرضی است."},"source":"none","surfaces":["sources","readout","tour","glb"]},{"id":"assumed.rooftop_sizes","status":"assumed","en":"Sizes of the fin, the crown block and the helipad, and the roof details. The brochure says rooftop use needs approved project records.","fa":"اندازه‌ی بدنه‌ی عمودی، بلوک بام و هلی‌پد و جزئیات بام. بروشور می‌گوید کاربری بام نیازمند مدارک مصوب است.","short":{"en":"Roof sizes are estimated; the brochure says rooftop use needs approved records.","fa":"اندازه‌های بام برآوردی است؛ بروشور می‌گوید کاربری بام نیازمند مدارک مصوب است."},"source":"none; brochure p26 for the helipad design","surfaces":["sources","tour","glb"]},{"id":"assumed.details","status":"assumed","en":"Detail dimensions: window reveal depth, frame sizes, stone panel and joint spacing, balcony slab and guard sizes, and the dark bands are estimated from the renders.","fa":"اندازه‌ی جزئیات: عمق پنجره، ضخامت قاب‌ها، ابعاد سنگ و درزها و اندازه‌ی دال و نرده‌ی بالکن و نوارهای تیره از روی رندرها برآورد شده است.","source":"none","surfaces":["sources","glb"]},{"id":"assumed.context","status":"assumed","en":"Street, lamps, trees, neighbouring buildings and the distant mountains are invented. The mountain shape is invented. Hide the first ones with Surroundings under More.","fa":"خیابان، تیرچراغ‌ها، درختان، ساختمان‌های همسایه و کوه‌های دور ساختگی‌اند. شکل کوه‌ها ساختگی است. با گزینه‌ی «محیط اطراف» در بخش بیشتر می‌توانید موارد اول را پنهان کنید.","short":{"en":"The surroundings are invented placeholders.","fa":"محیط اطراف جانگهدارهای ساختگی است."},"source":"none","surfaces":["sources","tour","glb"]},{"id":"assumed.garden","status":"assumed","en":"The garden layout and the plot are schematic.","fa":"چیدمان باغ و محوطه شماتیک است.","source":"none","surfaces":["sources","glb"]},{"id":"assumed.roof_height","status":"assumed","value":38.15,"unit":"m","en":"Roof height about {h} m with {n} typical floors. Derived from the assumed floor heights.","fa":"ارتفاع تا بام حدود {h} متر با {n} طبقه تیپ. از ارتفاع فرضی طبقات به دست آمده است.","short":{"en":"{n} typical floors · roof ≈ {h} m (assumed)","fa":"{n} طبقه تیپ · ارتفاع تا بام ≈ {h} متر (فرضی)"},"source":"derived from assumed.heights","labelled_by":"assumed.heights","surfaces":["readout"]},{"id":"conflict.areas","status":"conflict","en":"Unit areas. Brochure text and its plan labels: 143.25 / 150 / 166 / 162 m². The plan photo: 143.25 / 152.85 / 171.5 / 144.8 m². The Apartment 3 cutaway image itself is captioned 171.5 while the brochure page prints 166. The drawn outlines fit the plan photo better.","fa":"مساحت واحدها. متن بروشور و اعداد پلان آن: 143.25 / 150 / 166 / 162. عکس پلان: 143.25 / 152.85 / 171.5 / 144.8. خود تصویر واحد 3 عدد 171.5 را دارد ولی صفحه‌ی بروشور 166 چاپ کرده است. شکل ترسیم‌شده با عکس پلان بهتر می‌خواند.","short":{"en":"Unit areas differ between the brochure and the plan photo.","fa":"مساحت واحدها در بروشور و عکس پلان یکسان نیست."},"source":"brochure p19-23; IMG_1281; references/crops/apt_apt3.jpg","surfaces":["sources","apartment","tour"]},{"id":"conflict.floors","status":"conflict","value":[10,11],"en":"Floor count is not written anywhere. The brochure renders show 10 typical floors above the ground floor and the scale-model photo shows 11. Switch it under More.","fa":"تعداد طبقات در هیچ‌جا نوشته نشده. رندرهای بروشور 10 طبقه‌ی تیپ بالای همکف نشان می‌دهند و عکس ماکت 11 طبقه. در بخش بیشتر می‌توانید عوض کنید.","short":{"en":"Brochure renders show 10 typical floors, the scale-model photo shows 11.","fa":"رندرهای بروشور 10 طبقه‌ی تیپ و عکس ماکت 11 طبقه نشان می‌دهد."},"source":"brochure p02, p03; IMG_1164, IMG_1165","surfaces":["sources","tour"]},{"id":"conflict.slender","status":"conflict","en":"The renders show a slimmer, taller tower than the plan scale gives. They are concept images, so the model follows the plan.","fa":"رندرها برجی باریک‌تر و بلندتر از مقیاس پلان نشان می‌دهند. این تصاویر مفهومی‌اند، پس مدل از پلان پیروی می‌کند.","source":"brochure p02, p03 vs IMG_1281","surfaces":["sources"]},{"id":"conflict.orientation","status":"conflict","en":"Orientation. The plan is the mirror image of the photos and renders, so the model is built mirrored to match them. The brochure notes that north follows a reviewer sketch.","fa":"جهت‌گیری. پلان قرینه‌ی عکس‌ها و رندرهاست، پس مدل برای تطبیق با آن‌ها آینه‌ای ساخته شده است. بروشور یادآوری می‌کند که شمال از روی طرح بازبین گذاشته شده است.","source":"IMG_1281 vs brochure p02; brochure p19 footnote","surfaces":["sources"]},{"id":"conflict.balcony_guard","status":"conflict","en":"Brochure page 25 shows a balcony with a glass guardrail; the façade renders show dark slatted guards. The model follows the façade renders.","fa":"صفحه‌ی 25 بروشور بالکنی با جان‌پناه شیشه‌ای نشان می‌دهد؛ رندرهای نما جان‌پناه تیره‌ی شیاردار نشان می‌دهند. مدل از رندرهای نما پیروی می‌کند.","source":"brochure p25 vs p02, p06","surfaces":["sources"]},{"id":"conflict.roof_rail","status":"conflict","en":"The scale-model photos show a guard-rail along the roof edge; the brochure renders do not. The model has none.","fa":"عکس‌های ماکت جان‌پناه محافظ لبه‌ی بام را نشان می‌دهند؛ رندرهای بروشور نشان نمی‌دهند. مدل چنین جان‌پناهی ندارد.","source":"IMG_1164, IMG_1165 vs brochure p02, p26","surfaces":["sources"]}],"tour":[{"id":"exterior","view":"corner","light":"day","title":{"en":"The tower","fa":"برج"},"facts":["render.cladding","plan.four_apts","plan.outline"]},{"id":"entrance","view":"entrance","light":"golden","title":{"en":"Entrance","fa":"ورودی"},"facts":["render.entrance","amenities.ground"]},{"id":"fin","view":"fin","light":"day","title":{"en":"The fin and balconies","fa":"بدنه‌ی عمودی و بالکن‌ها"},"facts":["render.fin","render.balcony_guards"]},{"id":"roof","view":"helipad","light":"day","title":{"en":"Roof and helipad","fa":"بام و هلی‌پد"},"facts":["render.helipad","assumed.rooftop_sizes"]},{"id":"floor","view":"floors","light":"day","floor":6,"title":{"en":"A typical floor","fa":"یک طبقه تیپ"},"facts":["plan.four_apts","plan.partitions","conflict.floors"]},{"id":"apt1","view":"floors","light":"day","floor":6,"apt":"apt1","title":{"en":"Apartment 1","fa":"واحد 1"},"facts":["area.apt1.brochure"]},{"id":"apt2","view":"floors","light":"day","floor":6,"apt":"apt2","title":{"en":"Apartment 2","fa":"واحد 2"},"facts":["area.apt2.brochure","area.apt2.planphoto","conflict.areas"]},{"id":"apt3","view":"floors","light":"day","floor":6,"apt":"apt3","title":{"en":"Apartment 3","fa":"واحد 3"},"facts":["area.apt3.brochure","area.apt3.planphoto","conflict.areas"]},{"id":"apt4","view":"floors","light":"day","floor":6,"apt":"apt4","title":{"en":"Apartment 4","fa":"واحد 4"},"facts":["area.apt4.brochure","area.apt4.planphoto","conflict.areas"]},{"id":"night","view":"corner","light":"night","title":{"en":"At night","fa":"شب"},"facts":["assumed.context"]}]};

      clipPlane.constant = clipTween.from + (clipTween.to - clipTween.from) * ease(kc);
      if (kc >= 1) clipTween = null;
    }
    if (Math.abs(viewShift.cur - viewShift.target) > 0.0003) { viewShift.cur += (viewShift.target - viewShift.cur) * Math.min(1, dt / 220); applyViewShift(); }
    controls.update();
    if (camera.position.y < 1.8) { camera.position.y = 1.8; }
    sky.position.copy(camera.position);
    updateLabels(); tourTick(now);
    renderer.render(scene, camera);
    lastDraw = now;
    // adaptive resolution (Auto mode): if the device struggles, lower the pixel ratio once or twice.
    // Only frames drawn while something was happening are timed; the idle refresh says nothing about the device.
    if (!busy) return;
    frames++; acc += dt;
    if (frames === 90) {
      if (qualityMode === 'auto' && acc / frames > 34 && adapted < 2 && dpr > 1) { dpr = Math.max(1, dpr * 0.75); renderer.setPixelRatio(dpr); resize(); adapted++; }
      frames = 0; acc = 0;
    }
  }
})();
</script>
