# Runs the project's own checks on every push and pull request, so a later edit cannot quietly undo the work on speed,
# sharpness, honesty of the copy or Persian typography. Nothing is deployed or published from here.
name: checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -p "test_*.py"
      - name: Persian typography lint
        run: python3 tools/lint_persian.py
      - name: Cloudflare functions
        run: node --test tests/cloudflare.test.mjs

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install test dependencies
        run: npm install --no-audit --no-fund --no-save @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end, accessibility, sizes hints (Chromium desktop and Android)
        run: npx playwright test --reporter=line
        env:
          PW_CHROME_ONLY: '1'
      - name: Keep traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
