<div class="viewer rv" id="viewer">
  <div class="viewer__poster">
    <img data-img="panorama" sizes="(max-width: 1400px) 100vw, 1360px" alt="" aria-hidden="true">
    <button class="launch" id="launch" type="button">
      <span class="launch__dot"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></span>
      <span class="launch__txt">
        <span class="launch__t" en="Launch the 3D model">راه‌اندازی مدل سه‌بعدی</span>
        <span class="launch__s" en="About 0.7 MB · needs WebGL">حدود ۰٫۷ مگابایت · نیازمند WebGL</span>
      </span>
    </button>
  </div>
</div>
<div class="viewer__bar">
  <p class="small" en="Drag to orbit · scroll or pinch to zoom">برای چرخش بکشید · برای بزرگ‌نمایی اسکرول یا پینچ کنید</p>
  <div class="acts">
    <button type="button" id="fs-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <span en="Full screen">تمام‌صفحه</span></button>
    <a href="tower-viewer/index.html" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
      <span en="Open in a new tab">باز کردن در برگه‌ی جدید</span></a>
  </div>
</div>
